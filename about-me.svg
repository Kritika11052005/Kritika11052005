<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:1" />
    </linearGradient>

    <!-- Blue glow border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>

    <!-- Inner border gradient -->
    <linearGradient id="innerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:0.8" />
    </linearGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="900" height="3" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="rgba(59,130,246,0.03)" />
      <rect y="1" width="900" height="2" fill="transparent" />
    </pattern>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="0.5"/>
    </pattern>

    <!-- Glow filter for text -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for border -->
    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path -->
    <clipPath id="cardClip">
      <rect x="4" y="4" width="892" height="372" rx="12"/>
    </clipPath>

    <!-- Cyan glow -->
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Right panel gradient -->
    <linearGradient id="rightPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>

  </defs>

  <!-- Outer glow border -->
  <rect x="1" y="1" width="898" height="378" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#borderGlow)" opacity="0.9"/>

  <!-- Main card background -->
  <rect x="4" y="4" width="892" height="372" rx="12" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <rect x="4" y="4" width="892" height="372" rx="12" fill="url(#grid)" clip-path="url(#cardClip)"/>

  <!-- Right panel background -->
  <rect x="520" y="4" width="376" height="372" rx="0" fill="url(#rightPanel)" opacity="0.6" clip-path="url(#cardClip)"/>

  <!-- Divider line -->
  <line x1="520" y1="20" x2="520" y2="360" stroke="url(#borderGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Scanlines overlay -->
  <rect x="4" y="4" width="892" height="372" rx="12" fill="url(#scanlines)" clip-path="url(#cardClip)"/>

  <!-- Corner accents top-left -->
