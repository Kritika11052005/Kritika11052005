<svg width="100%" height="100%" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowCenter" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueOrb" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.25"/>
    </pattern>

    <!-- Dot Matrix -->
    <pattern id="dotMatrix" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#818CF8" fill-opacity="0.15"/>
    </pattern>

    <!-- Clipping -->
    <clipPath id="bannerClip">
      <rect width="1200" height="350" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect width="1200" height="350" fill="url(#bgGlowCenter)"/>
    <rect width="1200" height="350" fill="url(#cyanOrb)"/>
    <rect width="1200" height="350" fill="url(#purpleOrb)"/>
    <rect width="1200" height="350" fill="url(#blueOrb)"/>

    <!-- Grid Overlays -->
    <rect width="1200" height="350" fill="url(#techGrid)"/>
    <rect x="850" y="0" width="350" height="350" fill="url(#dotMatrix)" opacity="0.7"/>
    <rect x="0" y="0" width="350" height="350" fill="url(#dotMatrix)" opacity="0.7"/>

    <!-- Perspective Laser Grid Floor -->
    <g opacity="0.3" stroke="#38BDF8" stroke-width="0.6">
      <line x1="600" y1="260" x2="-200" y2="380" stroke-opacity="0.4"/>
      <line x1="600" y1="260" x2="0" y2="380" stroke-opacity="0.5"/>
      <line x1="600" y1="260" x2="200" y2="380" stroke-opacity="0.6"/>
      <line x1="600" y1="260" x2="400" y2="380" stroke-opacity="0.7"/>
      <line x1="600" y1="260" x2="600" y2="380" stroke-opacity="0.8"/>
      <line x1="600" y1="260" x2="800" y2="380" stroke-opacity="0.7"/>
      <line x1="600" y1="260" x2="1000" y2="380" stroke-opacity="0.6"/>
      <line x1="600" y1="260" x2="1200" y2="380" stroke-opacity="0.5"/>
      <line x1="600" y1="260" x2="1400" y2="380" stroke-opacity="0.4"/>
      <!-- Grid Horizontals -->
      <line x1="100" y1="290" x2="1100" y2="290" stroke-opacity="0.2"/>
      <line x1="0" y1="315" x2="1200" y2="315" stroke-opacity="0.4"/>
      <line x1="-100" y1="340" x2="1300" y2="340" stroke-opacity="0.6"/>
    </g>

    <!-- Cybernetic HUD Orbital Wheels (Left) -->
    <g transform="translate(100, 160)" opacity="0.45">
      <circle cx="0" cy="0" r="110" stroke="#06B6D4" stroke-width="1" stroke-dasharray="10 20" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="85" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="6 12 24 12" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="60" stroke="#8B5CF6" stroke-width="0.5" stroke-dasharray="4 8" fill="none"/>
      <!-- Crosshairs -->
      <line x1="-120" y1="0" x2="-95" y2="0" stroke="#06B6D4" stroke-width="1.5"/>
      <line x1="95" y1="0" x2="120" y2="0" stroke="#06B6D4" stroke-width="1.5"/>
      <line x1="0" y1="-120" x2="0" y2="-95" stroke="#06B6D4" stroke-width="1.5"/>
      <line x1="0" y1="95" x2="0" y2="120" stroke="#06B6D4" stroke-width="1.5"/>
    </g>

    <!-- Cybernetic HUD Orbital Wheels (Right) -->
    <g transform="translate(1100, 160)" opacity="0.45">
      <circle cx="0" cy="0" r="110" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="14 18" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="35s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="85" stroke="#06B6D4" stroke-width="0.8" stroke-dasharray="8 14 30 8" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="60" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="5 10" fill="none"/>
      <!-- Crosshairs -->
      <line x1="-120" y1="0" x2="-95" y2="0" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="95" y1="0" x2="120" y2="0" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="0" y1="-120" x2="0" y2="-95" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="0" y1="95" x2="0" y2="120" stroke="#8B5CF6" stroke-width="1.5"/>
    </g>

    <!-- Neural Constellation Lines & Glowing Nodes -->
    <g stroke="#38BDF8" stroke-width="0.8" opacity="0.6">
      <line x1="220" y1="70" x2="310" y2="120" stroke-opacity="0.4"/>
      <line x1="310" y1="120" x2="260" y2="200" stroke-opacity="0.3"/>
      <line x1="260" y1="200" x2="180" y2="170" stroke-opacity="0.5"/>
      <line x1="180" y1="170" x2="220" y2="70" stroke-opacity="0.3"/>
      <line x1="310" y1="120" x2="410" y2="90" stroke-opacity="0.4"/>
      
      <line x1="980" y1="70" x2="890" y2="120" stroke-opacity="0.4"/>
      <line x1="890" y1="120" x2="940" y2="200" stroke-opacity="0.3"/>
      <line x1="940" y1="200" x2="1020" y2="170" stroke-opacity="0.5"/>
      <line x1="1020" y1="170" x2="980" y2="70" stroke-opacity="0.3"/>
      <line x1="890" y1="120" x2="790" y2="90" stroke-opacity="0.4"/>
    </g>

    <!-- Pulsing Nodes -->
    <circle cx="220" cy="70" r="3.5" fill="#06B6D4" filter="url(#laserGlow)">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="120" r="4.5" fill="#3B82F6" filter="url(#laserGlow)">
      <animate attributeName="r" values="4;6.5;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="200" r="3" fill="#8B5CF6" filter="url(#laserGlow)"/>
    <circle cx="180" cy="170" r="3.5" fill="#06B6D4"/>
    <circle cx="410" cy="90" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="980" cy="70" r="3.5" fill="#8B5CF6" filter="url(#laserGlow)">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="120" r="4.5" fill="#3B82F6" filter="url(#laserGlow)">
      <animate attributeName="r" values="4;6.5;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="200" r="3" fill="#06B6D4" filter="url(#laserGlow)"/>
    <circle cx="1020" cy="170" r="3.5" fill="#C084FC"/>
    <circle cx="790" cy="90" r="4" fill="#818CF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- HUD Status Top Bars -->
    <g font-family="JetBrains Mono, monospace, Courier New" font-size="10" fill="#64748B" letter-spacing="1.5">
      <text x="45" y="36">SYS: <tspan fill="#10B981" font-weight="bold">ONLINE</tspan> [v2.7]</text>
      <text x="210" y="36">CORE: <tspan fill="#38BDF8">MoE_ROUTER_ACTIVE</tspan></text>
      <text x="960" y="36" text-anchor="end">LOC: <tspan fill="#CBD5E1">JAIPUR, IN</tspan> [26.91°N, 75.78°E]</text>
      <circle cx="1135" cy="32" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1135" cy="32" r="7" fill="none" stroke="#10B981" stroke-width="0.8">
        <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Top Badge Pill -->
    <g transform="translate(600, 68)">
      <rect x="-195" y="-14" width="390" height="28" rx="14" fill="#0B1329" stroke="url(#borderGrad)" stroke-width="1.2"/>
      <circle cx="-172" cy="0" r="4" fill="#38BDF8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, monospace, Segoe UI" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2.5">
        ✦ AI RESEARCH &amp; AGENTIC SYSTEMS ✦
      </text>
      <circle cx="172" cy="0" r="4" fill="#C084FC">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main Title: KRITIKA BENJWAL -->
    <g transform="translate(600, 150)">
      <!-- Cyber Frame Decorators -->
      <path d="M -360 -35 L -380 -35 L -380 15 L -360 15" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.8"/>
      <path d="M 360 -35 L 380 -35 L 380 15 L 360 15" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.8"/>
      
      <!-- Tech Markers -->
      <rect x="-395" y="-12" width="6" height="6" fill="#06B6D4" opacity="0.9"/>
      <rect x="389" y="-12" width="6" height="6" fill="#8B5CF6" opacity="0.9"/>

      <!-- Ambient Glow Behind Name -->
      <text x="0" y="2" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="900" fill="#38BDF8" opacity="0.3" filter="url(#neonGlowTitle)" letter-spacing="4">
        KRITIKA BENJWAL
      </text>
      
      <!-- Crisp Foreground Name -->
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="900" fill="url(#titleGrad)" letter-spacing="4">
        KRITIKA BENJWAL
      </text>
    </g>

    <!-- Tagline -->
    <g transform="translate(600, 202)">
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="url(#taglineGrad)" letter-spacing="1.2">
        "Building AI that thinks, systems that scale, and research that matters."
      </text>
    </g>

    <!-- Interactive / High-Tech Pills Row (Bottom) -->
    <g transform="translate(600, 260)">
      <!-- Pill 1: MoE & Bioacoustics -->
      <g transform="translate(-360, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="8" fill="url(#pillGrad1)" stroke="#06B6D4" stroke-width="0.9"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#E0F2FE">
          🧬 Mixture of Experts (MoE)
        </text>
      </g>

      <!-- Pill 2: Multi-Agent Swarms -->
      <g transform="translate(-120, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="8" fill="url(#pillGrad2)" stroke="#8B5CF6" stroke-width="0.9"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#F3E8FF">
          🤖 Multi-Agent Swarms
        </text>
      </g>

      <!-- Pill 3: Full-Stack Next.js / FastAPI -->
      <g transform="translate(120, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="8" fill="url(#pillGrad3)" stroke="#10B981" stroke-width="0.9"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#D1FAE5">
          ⚡ Next.js 15 · FastAPI · DBs
        </text>
      </g>

      <!-- Pill 4: CLEF & Springer Published -->
      <g transform="translate(360, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="8" fill="url(#pillGrad4)" stroke="#F59E0B" stroke-width="0.9"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#FEF3C7">
          📚 Published Researcher
        </text>
      </g>
    </g>

    <!-- Sub-Footer Tech Coordinates & Breadcrumb -->
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#475569" letter-spacing="1">
      <text x="45" y="318">B.Tech CSE @ Manipal Univ Jaipur '27</text>
      <text x="600" y="318" text-anchor="middle">Dean's List (GPA 9.11/10) · AI for Good Hackathon Winner</text>
      <text x="1155" y="318" text-anchor="end">Kritika11052005 // AGENTIC_SYS</text>
    </g>

    <!-- High-Tech Corner Brackets -->
    <!-- Top-Left -->
    <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="12" cy="12" r="2" fill="#06B6D4"/>
    <!-- Top-Right -->
    <path d="M 1160 12 L 1188 12 L 1188 40" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="1188" cy="12" r="2" fill="#8B5CF6"/>
    <!-- Bottom-Left -->
    <path d="M 12 310 L 12 338 L 40 338" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="12" cy="338" r="2" fill="#06B6D4"/>
    <!-- Bottom-Right -->
    <path d="M 1160 338 L 1188 338 L 1188 310" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="1188" cy="338" r="2" fill="#8B5CF6"/>

    <!-- Top & Bottom Laser Accent Lines -->
    <line x1="40" y1="1" x2="1160" y2="1" stroke="url(#borderGrad)" stroke-width="2"/>
    <line x1="40" y1="349" x2="1160" y2="349" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Light Sweep Animation Beam -->
    <line x1="0" y1="0" x2="0" y2="350" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" filter="url(#laserGlow)">
      <animate attributeName="x1" values="-100; 1300" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100; 1300" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.6; 0.6; 0" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
