name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"    # Runs daily
  workflow_dispatch:          # Manual trigger too
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contributions

    steps:
      - uses: actions/checkout@v3

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Kritika11052005

      - name: Commit & Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A .
          git commit -m "Generate 3D contribution calendar" || exit 0
          git push
