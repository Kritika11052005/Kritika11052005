name: Auto-Update Tech Vogue Cover Metrics

on:
  schedule:
    # Runs every 6 hours to sync latest profile views and GitHub commits
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'tech-vogue.svg'
      - 'header-banner.svg'

jobs:
  update-cover:
    runs-on: ubuntu-latest
    name: Sync Live Cover Metrics
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate Magazine Cover with Live Stats
        run: |
          python generate_cover.py
          cp tech-vogue.svg header-banner.svg

      - name: Commit & Push Updated Cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-vogue.svg header-banner.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync live magazine cover metrics [skip ci]" && git push)
